<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trackio</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style id="app-style">
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:#0a0a0a;font-family:'Instrument Sans',sans-serif;font-size:14px;overflow:hidden}
.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{width:196px;flex-shrink:0;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;padding:24px 0 20px;background:#fff}
.logo{padding:0 18px 22px;border-bottom:1px solid #e8e8e8;margin-bottom:10px}
.logo-word{font-family:'Instrument Serif',serif;font-size:21px;letter-spacing:-0.02em;color:#0a0a0a;line-height:1}
.logo-word em{font-style:italic;color:#888}
.logo-tag{font-size:10px;color:#bbb;margin-top:3px;letter-spacing:.05em;text-transform:uppercase}
.nav{flex:1;padding:0 8px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;color:#777;font-size:13px;transition:background .1s,color .1s;margin-bottom:2px;user-select:none}
.ni:hover{background:#f4f4f4;color:#0a0a0a}
.ni.on{background:#0a0a0a;color:#fff}
.ni svg{width:14px;height:14px;flex-shrink:0}
.sb-foot{padding:14px 18px 0;border-top:1px solid #e8e8e8;margin-top:8px}
.sb-foot-day{font-size:13px;font-weight:500;color:#0a0a0a}
.sb-foot-date{font-size:11px;color:#bbb;margin-top:1px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f7f7f7}
.topbar{height:50px;flex-shrink:0;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;padding:0 26px}
.tb-title{font-size:14px;font-weight:500}
.tb-meta{font-size:12px;color:#bbb}
.content{flex:1;overflow-y:auto;padding:24px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}

/* PANELS */
.panel{display:none}
.panel.on{display:block;animation:up .16s ease}
@keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:15px 17px}
.stat-l{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.stat-v{font-size:23px;font-weight:600;letter-spacing:-0.03em;line-height:1}

/* CARD */
.card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:18px 20px;margin-bottom:12px}
.ch{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:14px}
.ch-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ch-row .ch{margin-bottom:0}

/* FORM */
.fr{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:90px}
.fg label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.05em}
input,select{background:#fff;border:1px solid #ddd;border-radius:6px;padding:8px 10px;color:#0a0a0a;font-family:'Instrument Sans',sans-serif;font-size:13px;outline:none;width:100%;transition:border-color .12s}
input:focus,select:focus{border-color:#0a0a0a}
input::placeholder{color:#ccc}
select option{background:#fff}
button{background:#0a0a0a;color:#fff;border:none;border-radius:6px;padding:8px 15px;font-family:'Instrument Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .12s;white-space:nowrap}
button:hover{opacity:.75}
button.s{background:#f0f0f0;color:#0a0a0a}
button.s:hover{background:#e8e8e8;opacity:1}
button.xs{padding:4px 8px;font-size:11px;border-radius:4px}
button.pipbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px}
button.pipbtn svg{width:13px;height:13px}

/* LIST ROWS */
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f2f2f2;gap:10px}
.row:last-child{border-bottom:none}
.rn{font-size:13px}
.rr{display:flex;align-items:center;gap:7px;flex-shrink:0}
.pill{padding:2px 7px;border-radius:4px;font-size:11px;border:1px solid #e8e8e8;color:#666;background:#f8f8f8}
.pill.dk{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.mono{font-size:13px;font-weight:500}
.dim{font-size:11px;color:#ccc}

/* TIMER */
.tnum{font-family:'Instrument Serif',serif;font-size:60px;letter-spacing:.03em;text-align:center;padding:20px 0 18px;line-height:1}
.tbtns{display:flex;gap:8px;justify-content:center}
.pip-note{font-size:11px;color:#bbb;text-align:center;margin-top:12px}
.pip-note.hide{display:none}

/* PiP window (also used inside the floating window) */
.pipwrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;background:#fff}
.pipsubj{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.07em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipwrap .tnum{font-size:46px;padding:0}
.pipwrap .tbtns{flex-wrap:wrap}

/* HABITS */
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.hc{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px 16px}
.hc.done{border-color:#0a0a0a}
.hct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hcn{font-size:13px;font-weight:500}
.hcs{font-size:11px;color:#bbb;margin-top:2px}
.bar{height:3px;background:#f0f0f0;border-radius:2px;margin-bottom:10px;overflow:hidden}
.bf{height:100%;background:#0a0a0a;border-radius:2px}
.hcb{width:100%}
.hcb.dn{background:#f0f0f0;color:#0a0a0a}

/* LEARN */
.lc{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px 17px;margin-bottom:9px}
.lct{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.lcn{font-size:13px;font-weight:500}
.lcr{display:flex;align-items:center;gap:9px}
.lcp{font-size:12px;color:#aaa}
input[type=range]{accent-color:#0a0a0a;width:100%;cursor:pointer;margin-top:5px}

/* BREAKDOWN */
.br{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid #f2f2f2}
.br:last-child{border-bottom:none}
.brn{font-size:13px;min-width:85px}
.brt{flex:1;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.brf{height:100%;background:#0a0a0a;border-radius:2px}
.brv{font-size:12px;color:#999;min-width:45px;text-align:right}

.empty{padding:32px 0;text-align:center;color:#ccc;font-size:13px}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-word">Track<em>io</em></div>
      <div class="logo-tag">Personal dashboard</div>
    </div>
    <nav class="nav">
      <div class="ni on" onclick="go('expenses',this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/><path d="M1.5 6.5h13"/><circle cx="5" cy="9.5" r="1" fill="currentColor" stroke="none"/></svg>
        Expenses
      </div>
      <div class="ni" onclick="go('study',this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.2"/></svg>
        Study
      </div>
      <div class="ni" onclick="go('habits',this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 8.5l3.5 3L13 4"/></svg>
        Habits
      </div>
      <div class="ni" onclick="go('learning',this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L2 5l6 3 6-3-6-3z"/><path d="M2 5v4.5c0 1.5 2.5 3 6 3s6-1.5 6-3V5"/></svg>
        Learning
      </div>
      <div class="ni" onclick="go('snacks',this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 2.5h7l1 4.5h-9l1-4.5z"/><rect x="2.5" y="7" width="11" height="6.5" rx="1.5"/></svg>
        Snack Sales
      </div>
    </nav>
    <div class="sb-foot">
      <div class="sb-foot-day" id="sb-day"></div>
      <div class="sb-foot-date" id="sb-date"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="tb-title" id="tb-title">Expenses</span>
      <span class="tb-meta" id="tb-meta"></span>
    </div>
    <div class="content">

      <div class="panel on" id="p-expenses">
        <div class="stats" id="exp-stats"></div>
        <div class="card">
          <div class="ch">New entry</div>
          <div class="fr">
            <div class="fg" style="flex:2"><label>Description</label><input id="exp-desc" placeholder="e.g. Lunch, bus fare…"/></div>
            <div class="fg" style="max-width:115px"><label>Amount ($)</label><input id="exp-amt" type="number" placeholder="0.00" min="0" step="0.01"/></div>
            <div class="fg" style="max-width:125px"><label>Category</label>
              <select id="exp-cat"><option>Food</option><option>Transport</option><option>School</option><option>Entertainment</option><option>Other</option></select>
            </div>
            <button onclick="addExpense()" style="align-self:flex-end">Add</button>
          </div>
        </div>
        <div class="card"><div class="ch">History</div><div id="exp-list"></div></div>
      </div>

      <div class="panel" id="p-study">
        <div class="stats" id="study-stats"></div>
        <div class="card">
          <div class="ch-row">
            <div class="ch">Timer</div>
            <button class="s xs pipbtn" id="pipbtn" onclick="togglePiP()" title="Float the timer above other windows">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><rect x="8" y="8" width="5" height="3.5" rx=".8" fill="currentColor" stroke="none"/></svg>
              <span id="pipbtn-label">Pop out</span>
            </button>
          </div>
          <div class="fr" style="margin-bottom:14px">
            <div class="fg"><label>Subject</label><input id="study-subj" placeholder="e.g. Math, Biology…"/></div>
          </div>
          <div class="tnum" id="tdisp">00:00:00</div>
          <div class="tbtns">
            <button id="tbtn" onclick="toggleTimer()">Start</button>
            <button class="s" onclick="resetTimer()">Reset</button>
            <button class="s" id="logbtn" style="display:none" onclick="logSession()">Log session</button>
          </div>
          <div class="pip-note" id="pip-note">Tip: “Pop out” floats the timer so you can control it from other tabs.</div>
        </div>
        <div class="card"><div class="ch">Sessions</div><div id="study-list"></div></div>
      </div>

      <div class="panel" id="p-habits">
        <div class="stats" id="habit-stats"></div>
        <div class="card" style="margin-bottom:16px">
          <div class="ch">New habit</div>
          <div class="fr">
            <div class="fg"><label>Name</label><input id="habit-name" placeholder="e.g. Drink 8 glasses of water…"/></div>
            <button onclick="addHabit()" style="align-self:flex-end">Add</button>
          </div>
        </div>
        <div class="hg" id="hgrid"></div>
      </div>

      <div class="panel" id="p-learning">
        <div class="stats" id="learn-stats"></div>
        <div class="card">
          <div class="ch">Add item</div>
          <div class="fr">
            <div class="fg" style="flex:2"><label>Title</label><input id="learn-title" placeholder="Course, book, or skill…"/></div>
            <div class="fg" style="max-width:125px"><label>Type</label><select id="learn-type"><option>Course</option><option>Book</option><option>Skill</option></select></div>
            <button onclick="addLearnItem()" style="align-self:flex-end">Add</button>
          </div>
        </div>
        <div id="learn-list"></div>
      </div>

      <div class="panel" id="p-snacks">
        <div class="stats" id="snack-stats"></div>
        <div class="card">
          <div class="ch">Log sale</div>
          <div class="fr">
            <div class="fg" style="flex:2"><label>Snack</label><input id="snack-name" placeholder="e.g. Chips, Candy bar…"/></div>
            <div class="fg" style="max-width:75px"><label>Qty</label><input id="snack-qty" type="number" value="1" min="1"/></div>
            <div class="fg" style="max-width:95px"><label>Price ($)</label><input id="snack-price" type="number" placeholder="0.00" step="0.25" min="0"/></div>
            <button onclick="addSnackSale()" style="align-self:flex-end">Log</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="card"><div class="ch">Recent sales</div><div id="snack-list"></div></div>
          <div class="card"><div class="ch">By type</div><div id="snack-break"></div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// Show real error details instead of an opaque "Script error."
function showBanner(msg){
  let b=document.getElementById('err-banner');
  if(!b){b=document.createElement('div');b.id='err-banner';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#0a0a0a;color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.4';
    document.body.appendChild(b);}
  b.textContent=msg;
}
window.addEventListener('error',e=>showBanner('Error: '+(e.message||'unknown')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>showBanner('Error: '+((e.reason&&e.reason.message)||e.reason)));

// Local storage "database" (saved on this device, no account or server needed)
const STORE_KEY='trackio_db';
let store={};
try{store=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{};}catch(e){store={};}
const listeners={};
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store));}catch(e){showBanner('Couldn’t save: storage is full or blocked.');}}
function snapshot(coll){
  const data=store[coll]||{};
  return {forEach:fn=>{Object.keys(data).forEach(k=>{fn({key:k,val:()=>data[k]});});}};
}
function notify(coll){(listeners[coll]||[]).forEach(cb=>cb(snapshot(coll)));}
const db=null;
const ref=(d,path)=>path;
const onValue=(path,cb)=>{(listeners[path]=listeners[path]||[]).push(cb);cb(snapshot(path));};
const push=(path,val)=>{
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  (store[path]=store[path]||{})[id]=val;persist();notify(path);
};
const remove=path=>{
  const [coll,id]=path.split('/');
  if(id){if(store[coll])delete store[coll][id];}else delete store[coll];
  persist();notify(coll);
};
const update=(path,vals)=>{
  const [coll,id]=path.split('/');
  if(store[coll]&&store[coll][id]){Object.assign(store[coll][id],vals);persist();notify(coll);}
};
const today = new Date().toISOString().split('T')[0];
const now = new Date();
document.getElementById('sb-day').textContent = now.toLocaleDateString('en-US',{weekday:'long'});
document.getElementById('sb-date').textContent = now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

const titles={expenses:'Expenses',study:'Study',habits:'Habits',learning:'Learning',snacks:'Snack Sales'};
window.go=function(name,el){
  document.querySelectorAll('.ni').forEach(i=>i.classList.remove('on'));
  el.classList.add('on');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+name).classList.add('on');
  document.getElementById('tb-title').textContent=titles[name];
};

// EXPENSES
let expenses=[];
onValue(ref(db,'expenses'),s=>{expenses=[];s.forEach(c=>expenses.push({id:c.key,...c.val()}));renderExp()});
window.addExpense=function(){
  const d=document.getElementById('exp-desc').value.trim();
  const a=parseFloat(document.getElementById('exp-amt').value);
  const c=document.getElementById('exp-cat').value;
  if(!d||!a||a<=0)return;
  push(ref(db,'expenses'),{desc:d,amount:a,cat:c,date:today,ts:Date.now()});
  document.getElementById('exp-desc').value='';
  document.getElementById('exp-amt').value='';
};
window.delExp=id=>remove(ref(db,'expenses/'+id));
function renderExp(){
  const total=expenses.reduce((s,e)=>s+e.amount,0);
  const tod=expenses.filter(e=>e.date===today).reduce((s,e)=>s+e.amount,0);
  const cats={};expenses.forEach(e=>{cats[e.cat]=(cats[e.cat]||0)+e.amount});
  const top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('exp-stats').innerHTML=`
    <div class="stat"><div class="stat-l">All time</div><div class="stat-v">$${total.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-l">Today</div><div class="stat-v">$${tod.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-l">Entries</div><div class="stat-v">${expenses.length}</div></div>
    <div class="stat"><div class="stat-l">Top category</div><div class="stat-v" style="font-size:16px">${top?top[0]:'—'}</div></div>`;
  document.getElementById('tb-meta').textContent='';
  const s=[...expenses].sort((a,b)=>b.ts-a.ts);
  document.getElementById('exp-list').innerHTML=s.length?s.slice(0,40).map(e=>`
    <div class="row"><span class="rn">${e.desc}</span>
    <div class="rr"><span class="pill">${e.cat}</span><span class="mono">$${e.amount.toFixed(2)}</span><span class="dim">${e.date}</span>
    <button class="s xs" onclick="delExp('${e.id}')">✕</button></div></div>`).join('')
  :'<div class="empty">Nothing logged yet</div>';
}

// STUDY — timestamp-based so it stays accurate even when the tab is in the background
let accSec=0,startedAt=null,sessions=[];
let pipWin=null,pipVideo=null,pipCanvas=null,pipMode=null; // pipMode: 'doc' | 'video' | null
const hasDocPiP='documentPictureInPicture' in window;
const canCapture=typeof HTMLCanvasElement.prototype.captureStream==='function';
const vProbe=document.createElement('video');
const hasVideoPiP=canCapture&&(!!document.pictureInPictureEnabled||typeof vProbe.webkitSetPresentationMode==='function');

// Persist the timer so it survives switching apps, iOS reloading the tab, or a refresh
function saveTimer(){try{localStorage.setItem('trackio_timer',JSON.stringify({accSec,startedAt,subj:document.getElementById('study-subj').value}))}catch(e){}}
try{
  const saved=JSON.parse(localStorage.getItem('trackio_timer')||'null');
  if(saved){accSec=saved.accSec||0;startedAt=saved.startedAt||null;document.getElementById('study-subj').value=saved.subj||'';}
}catch(e){}
document.getElementById('study-subj').addEventListener('input',saveTimer);
// Snap the display to the true time the moment you come back to the app/tab
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTimer();});
window.addEventListener('pageshow',()=>refreshTimer());

onValue(ref(db,'study_sessions'),s=>{sessions=[];s.forEach(c=>sessions.push({id:c.key,...c.val()}));renderStudy()});

function p2(n){return String(n).padStart(2,'0')}
function elapsed(){return accSec+(startedAt?(Date.now()-startedAt)/1000:0)}
function fmt(sec){sec=Math.floor(sec);return `${p2(Math.floor(sec/3600))}:${p2(Math.floor((sec%3600)/60))}:${p2(sec%60)}`}
function isRunning(){return startedAt!==null}
function subject(){return document.getElementById('study-subj').value.trim()}

// Updates every place the timer is shown (main page, floating window, video fallback)
function refreshTimer(){
  const t=fmt(elapsed());
  const running=isRunning();
  const hasTime=elapsed()>0;
  const label=running?'Pause':(hasTime?'Resume':'Start');
  document.getElementById('tdisp').textContent=t;
  document.getElementById('tbtn').textContent=label;
  document.getElementById('logbtn').style.display=hasTime?'':'none';
  document.title=running?`${t} · Trackio`:'Trackio';

  if(pipMode==='doc'&&pipWin&&!pipWin.closed){
    const d=pipWin.document;
    const set=(id,v)=>{const el=d.getElementById(id);if(el&&el.textContent!==v)el.textContent=v};
    set('pip-time',t);
    set('pip-toggle',label);
    set('pip-subj',subject()||'Study session');
    const lb=d.getElementById('pip-log');
    if(lb)lb.style.display=hasTime?'':'none';
  }
  if(pipMode==='video')drawVideoFrame(t);
}
// The main interval drives the page; the floating window runs its own interval too,
// because background tabs throttle timers but a visible PiP window does not.
setInterval(refreshTimer,250);

window.toggleTimer=function(){
  if(isRunning()){accSec=elapsed();startedAt=null;}
  else{startedAt=Date.now();}
  saveTimer();
  refreshTimer();
  if(pipMode==='video')syncMediaSession();
};
window.resetTimer=function(){accSec=0;startedAt=null;saveTimer();refreshTimer();if(pipMode==='video')syncMediaSession();};
window.logSession=function(){
  const sec=elapsed();
  if(sec<5)return;
  const subj=subject()||'General';
  push(ref(db,'study_sessions'),{subject:subj,minutes:Math.max(1,Math.round(sec/60)),date:today,ts:Date.now()});
  window.resetTimer();
};
window.delSession=id=>remove(ref(db,'study_sessions/'+id));

// ---- Picture-in-Picture ----
function setPipUI(on){
  document.getElementById('pipbtn-label').textContent=on?'Close pop-out':'Pop out';
  document.getElementById('pip-note').classList.toggle('hide',on);
}

window.togglePiP=async function(){
  if(pipMode){closePiP();return;}
  try{
    if(hasDocPiP)await openDocPiP();
    else if(hasVideoPiP)await openVideoPiP();
    else alert('Picture-in-picture isn’t supported in this browser. Chrome or Edge works best.');
  }catch(err){
    console.error(err);
    alert('Couldn’t open the pop-out: '+(err&&err.message?err.message:err));
  }
};

function closePiP(){
  if(pipMode==='doc'&&pipWin&&!pipWin.closed)pipWin.close();
  if(pipMode==='video'){
    if(document.pictureInPictureElement)document.exitPictureInPicture().catch(()=>{});
    else if(pipVideo&&pipVideo.webkitSetPresentationMode)pipVideo.webkitSetPresentationMode('inline');
    if(pipVideo){pipVideo.pause();pipVideo.srcObject=null;}
  }
  pipMode=null;pipWin=null;setPipUI(false);
}

// Preferred: Document Picture-in-Picture (Chrome/Edge 116+) — a real mini window with working buttons
async function openDocPiP(){
  const w=await documentPictureInPicture.requestWindow({width:300,height:210});
  pipWin=w;pipMode='doc';

  // carry over fonts + styles
  document.querySelectorAll('link[rel="stylesheet"]').forEach(l=>{
    const c=w.document.createElement('link');c.rel='stylesheet';c.href=l.href;w.document.head.appendChild(c);
  });
  const st=w.document.createElement('style');
  st.textContent=document.getElementById('app-style').textContent;
  w.document.head.appendChild(st);

  w.document.body.style.overflow='hidden';
  w.document.body.innerHTML=`
    <div class="pipwrap">
      <div class="pipsubj" id="pip-subj"></div>
      <div class="tnum" id="pip-time">00:00:00</div>
      <div class="tbtns">
        <button id="pip-toggle">Start</button>
        <button class="s" id="pip-reset">Reset</button>
        <button class="s" id="pip-log" style="display:none">Log</button>
      </div>
    </div>`;
  w.document.getElementById('pip-toggle').onclick=()=>window.toggleTimer();
  w.document.getElementById('pip-reset').onclick=()=>window.resetTimer();
  w.document.getElementById('pip-log').onclick=()=>window.logSession();

  // un-throttled ticking from the PiP window itself
  const iv=w.setInterval(refreshTimer,250);
  w.addEventListener('pagehide',()=>{
    w.clearInterval(iv);
    if(pipMode==='doc'){pipMode=null;pipWin=null;setPipUI(false);}
  });
  setPipUI(true);
  refreshTimer();
}

// Fallback: video Picture-in-Picture (Safari / Firefox) — shows the time; play/pause buttons control the timer
async function openVideoPiP(){
  if(!pipCanvas){pipCanvas=document.createElement('canvas');pipCanvas.width=480;pipCanvas.height=270;}
  if(!pipVideo){
    pipVideo=document.createElement('video');
    pipVideo.muted=true;pipVideo.playsInline=true;
    pipVideo.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(pipVideo);
    pipVideo.addEventListener('leavepictureinpicture',()=>{
      if(pipMode==='video'){pipMode=null;setPipUI(false);pipVideo.pause();}
    });
    // let the native PiP play/pause button drive the timer
    pipVideo.addEventListener('pause',()=>{if(pipMode==='video'&&isRunning())window.toggleTimer();});
    pipVideo.addEventListener('play',()=>{if(pipMode==='video'&&!isRunning())window.toggleTimer();});
  }
  pipMode='video';
  drawVideoFrame(fmt(elapsed()));
  pipVideo.srcObject=pipCanvas.captureStream(5);
  await pipVideo.play().catch(()=>{});
  if(typeof pipVideo.requestPictureInPicture==='function'){
    await pipVideo.requestPictureInPicture();
  }else if(typeof pipVideo.webkitSetPresentationMode==='function'){
    // iPhone / older iOS Safari
    pipVideo.webkitSetPresentationMode('picture-in-picture');
    pipVideo.addEventListener('webkitpresentationmodechanged',()=>{
      if(pipVideo.webkitPresentationMode!=='picture-in-picture'&&pipMode==='video'){pipMode=null;setPipUI(false);pipVideo.pause();}
    });
  }else throw new Error('Picture-in-picture isn’t available here');
  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play',()=>{if(!isRunning())window.toggleTimer();});
    navigator.mediaSession.setActionHandler('pause',()=>{if(isRunning())window.toggleTimer();});
  }
  setPipUI(true);
  syncMediaSession();
}
function syncMediaSession(){
  if(!pipVideo||pipMode!=='video')return;
  // keep the video's play state aligned with the timer so the PiP button shows the right icon
  if(isRunning()&&pipVideo.paused){pipVideo.play().catch(()=>{});}
  else if(!isRunning()&&!pipVideo.paused){pipVideo.pause();}
}
function drawVideoFrame(t){
  if(!pipCanvas)return;
  const c=pipCanvas.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,480,270);
  c.fillStyle='#aaa';c.font='500 20px "Instrument Sans",sans-serif';c.textAlign='center';
  c.fillText((subject()||'Study session').toUpperCase().slice(0,28),240,90);
  c.fillStyle='#0a0a0a';c.font='96px "Instrument Serif",serif';
  c.fillText(t,240,175);
  c.fillStyle='#bbb';c.font='500 18px "Instrument Sans",sans-serif';
  c.fillText(isRunning()?'Running':(elapsed()>0?'Paused':'Ready'),240,225);
}

function renderStudy(){
  const total=sessions.reduce((s,e)=>s+e.minutes,0);
  const tod=sessions.filter(e=>e.date===today).reduce((s,e)=>s+e.minutes,0);
  const days=new Set(sessions.map(e=>e.date)).size;
  document.getElementById('study-stats').innerHTML=`
    <div class="stat"><div class="stat-l">Total hours</div><div class="stat-v">${(total/60).toFixed(1)}h</div></div>
    <div class="stat"><div class="stat-l">Today</div><div class="stat-v">${tod}m</div></div>
    <div class="stat"><div class="stat-l">Days studied</div><div class="stat-v">${days}</div></div>`;
  const s=[...sessions].sort((a,b)=>b.ts-a.ts);
  document.getElementById('study-list').innerHTML=s.length?s.slice(0,20).map(e=>`
    <div class="row"><span class="rn">${e.subject}</span>
    <div class="rr"><span class="pill">${e.minutes} min</span><span class="dim">${e.date}</span>
    <button class="s xs" onclick="delSession('${e.id}')">✕</button></div></div>`).join('')
  :'<div class="empty">No sessions yet</div>';
}

// HABITS
let habits=[],hlogs=[];
onValue(ref(db,'habits'),s=>{habits=[];s.forEach(c=>habits.push({id:c.key,...c.val()}));renderHabits()});
onValue(ref(db,'habit_logs'),s=>{hlogs=[];s.forEach(c=>hlogs.push({id:c.key,...c.val()}));renderHabits()});
window.addHabit=function(){const n=document.getElementById('habit-name').value.trim();if(!n)return;push(ref(db,'habits'),{name:n,created:today});document.getElementById('habit-name').value='';};
window.toggleHabit=function(hid){const done=hlogs.find(l=>l.habitId===hid&&l.date===today);if(done)remove(ref(db,'habit_logs/'+done.id));else push(ref(db,'habit_logs'),{habitId:hid,date:today,ts:Date.now()});};
window.delHabit=function(id){remove(ref(db,'habits/'+id));hlogs.filter(l=>l.habitId===id).forEach(l=>remove(ref(db,'habit_logs/'+l.id)));};
function streak(hid){
  const dates=[...new Set(hlogs.filter(l=>l.habitId===hid).map(l=>l.date))].sort().reverse();
  if(!dates.length)return 0;let s=0,cur=new Date(today);
  for(let i=0;i<dates.length;i++){const d=new Date(dates[i]);if(Math.round((cur-d)/86400000)<=1){s++;cur=d;}else break;}
  return s;
}
function renderHabits(){
  const done=habits.filter(h=>hlogs.some(l=>l.habitId===h.id&&l.date===today)).length;
  const pct=habits.length?Math.round((done/habits.length)*100):0;
  document.getElementById('habit-stats').innerHTML=`
    <div class="stat"><div class="stat-l">Done today</div><div class="stat-v">${done}/${habits.length}</div></div>
    <div class="stat"><div class="stat-l">Rate</div><div class="stat-v">${pct}%</div></div>
    <div class="stat"><div class="stat-l">Total</div><div class="stat-v">${habits.length}</div></div>`;
  document.getElementById('hgrid').innerHTML=habits.length?habits.map(h=>{
    const isDone=hlogs.some(l=>l.habitId===h.id&&l.date===today);
    const st=streak(h.id);
    const all=hlogs.filter(l=>l.habitId===h.id).length;
    const age=Math.max(1,Math.round((new Date(today)-new Date(h.created))/86400000)+1);
    const comp=Math.round((all/age)*100);
    return `<div class="hc${isDone?' done':''}">
      <div class="hct"><div><div class="hcn">${h.name}</div><div class="hcs">${st} day streak · ${comp}%</div></div>
      <button class="s xs" onclick="delHabit('${h.id}')">✕</button></div>
      <div class="bar"><div class="bf" style="width:${comp}%"></div></div>
      <button class="hcb${isDone?' dn':''}" onclick="toggleHabit('${h.id}')">${isDone?'✓ Done today':'Mark done'}</button>
    </div>`;}).join('')
  :'<div class="empty" style="grid-column:1/-1">No habits yet</div>';
}

// LEARNING
let items=[];
onValue(ref(db,'learn_items'),s=>{items=[];s.forEach(c=>items.push({id:c.key,...c.val()}));renderLearn()});
window.addLearnItem=function(){const t=document.getElementById('learn-title').value.trim();const ty=document.getElementById('learn-type').value;if(!t)return;push(ref(db,'learn_items'),{title:t,type:ty,progress:0,added:today,ts:Date.now()});document.getElementById('learn-title').value='';};
window.updateProg=function(id,val){update(ref(db,'learn_items/'+id),{progress:parseInt(val)})};
window.delLearn=id=>remove(ref(db,'learn_items/'+id));
function renderLearn(){
  const done=items.filter(i=>i.progress===100).length;
  const avg=items.length?Math.round(items.reduce((s,i)=>s+i.progress,0)/items.length):0;
  document.getElementById('learn-stats').innerHTML=`
    <div class="stat"><div class="stat-l">Tracked</div><div class="stat-v">${items.length}</div></div>
    <div class="stat"><div class="stat-l">Completed</div><div class="stat-v">${done}</div></div>
    <div class="stat"><div class="stat-l">Avg progress</div><div class="stat-v">${avg}%</div></div>`;
  const s=[...items].sort((a,b)=>b.ts-a.ts);
  document.getElementById('learn-list').innerHTML=s.length?s.map(i=>`
    <div class="lc">
      <div class="lct">
        <div style="display:flex;align-items:center;gap:8px"><span class="pill${i.progress===100?' dk':''}">${i.type}</span><span class="lcn">${i.title}</span></div>
        <div class="lcr"><span class="lcp">${i.progress}%</span><button class="s xs" onclick="delLearn('${i.id}')">✕</button></div>
      </div>
      <div class="bar"><div class="bf" style="width:${i.progress}%"></div></div>
      <input type="range" min="0" max="100" value="${i.progress}" oninput="updateProg('${i.id}',this.value)"/>
    </div>`).join(''):'<div class="empty">No items yet</div>';
}

// SNACKS
let sales=[];
onValue(ref(db,'snack_sales'),s=>{sales=[];s.forEach(c=>sales.push({id:c.key,...c.val()}));renderSnacks()});
window.addSnackSale=function(){
  const n=document.getElementById('snack-name').value.trim();
  const q=Math.max(1,parseInt(document.getElementById('snack-qty').value)||1);
  const p=parseFloat(document.getElementById('snack-price').value);
  if(!n||isNaN(p)||p<0)return;
  push(ref(db,'snack_sales'),{name:n,qty:q,price:p,total:q*p,date:today,ts:Date.now()});
  document.getElementById('snack-name').value='';document.getElementById('snack-qty').value='1';document.getElementById('snack-price').value='';
};
window.delSale=id=>remove(ref(db,'snack_sales/'+id));
function renderSnacks(){
  const rev=sales.reduce((s,e)=>s+e.total,0);
  const tod=sales.filter(e=>e.date===today).reduce((s,e)=>s+e.total,0);
  const qty=sales.reduce((s,e)=>s+e.qty,0);
  const top=Object.entries(sales.reduce((a,e)=>{a[e.name]=(a[e.name]||0)+e.qty;return a},{})).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('snack-stats').innerHTML=`
    <div class="stat"><div class="stat-l">Revenue</div><div class="stat-v">$${rev.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-l">Today</div><div class="stat-v">$${tod.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-l">Sold</div><div class="stat-v">${qty}</div></div>
    <div class="stat"><div class="stat-l">Best seller</div><div class="stat-v" style="font-size:15px">${top?top[0]:'—'}</div></div>`;
  const s=[...sales].sort((a,b)=>b.ts-a.ts);
  document.getElementById('snack-list').innerHTML=s.length?s.slice(0,20).map(e=>`
    <div class="row"><span class="rn">${e.name}</span>
    <div class="rr"><span class="pill">×${e.qty}</span><span class="mono">$${e.total.toFixed(2)}</span><span class="dim">${e.date}</span>
    <button class="s xs" onclick="delSale('${e.id}')">✕</button></div></div>`).join('')
  :'<div class="empty">No sales yet</div>';
  const bd={};sales.forEach(e=>{if(!bd[e.name])bd[e.name]={qty:0,rev:0};bd[e.name].qty+=e.qty;bd[e.name].rev+=e.total;});
  const maxR=Math.max(...Object.values(bd).map(v=>v.rev),1);
  document.getElementById('snack-break').innerHTML=Object.entries(bd).sort((a,b)=>b[1].rev-a[1].rev).map(([n,v])=>`
    <div class="br"><span class="brn">${n}</span><div class="brt"><div class="brf" style="width:${Math.round((v.rev/maxR)*100)}%"></div></div><span class="brv">$${v.rev.toFixed(2)}</span></div>`).join('')||'<div class="empty">No data</div>';
}

refreshTimer();
</script>
